<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置词元智研生图</title>
<style nonce="__NONCE__">
  :root { color-scheme: light; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #162f31; background: #eff7f6; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 16px; }
  main { max-width: 560px; margin: 0 auto; background: #fff; padding: clamp(20px, 5vw, 36px); border: 1px solid #c9dfdc; border-radius: 20px; }
  h1 { margin: 0 0 12px; font-size: clamp(24px, 5vw, 32px); line-height: 1.25; }
  p, li { line-height: 1.65; }
  ol { padding-left: 1.5em; }
  li { margin: .4em 0; }
  a { color: #005e60; text-underline-offset: .2em; }
  label { display: block; margin: 24px 0 8px; font-weight: 650; }
  input, select, button { width: 100%; padding: 11px 12px; border-radius: 8px; font: inherit; }
  input, select { color: inherit; background: #fff; border: 1px solid #71928e; }
  button { cursor: pointer; margin-top: 12px; background: #005e60; color: #fff; border: 1px solid transparent; font-weight: 650; }
  button:disabled { cursor: wait; opacity: .7; }
  a:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid #005e60; outline-offset: 3px; }
  small { display: block; margin-top: 10px; color: #435e5c; line-height: 1.5; }
  #status:empty { display: none; }
  #status { margin: 16px 0 0; color: #933323; overflow-wrap: anywhere; }
  #success { margin: 0; overflow-wrap: anywhere; }
</style>
<main>
  <h1 id="title">设置词元智研生图</h1>
  <div id="instructions">
    <ol>
      <li><a href="https://ciyuanzhiyan.com/keys" target="_blank" rel="noopener noreferrer">打开词元智研的 API 密钥页面</a>，按提示登录或注册。</li>
      <li>点击「创建密钥」，选择支持生图的分组。<a href="https://www.ciyuanzhiyan.com/#/docs/image-faq" target="_blank" rel="noopener noreferrer">查看生图分组指南</a></li>
      <li>复制完整密钥，回到本页粘贴。</li>
    </ol>
  </div>
  <form id="setup" autocomplete="off">
    <div id="key-step">
      <label for="key">API 密钥</label>
      <input id="key" type="password" required maxlength="4096" spellcheck="false" autocapitalize="off" aria-describedby="privacy">
      <small id="privacy">插件会用密钥向词元智研验证可用模型，并将密钥保存在当前电脑。验证不会生成图片。</small>
    </div>
    <div id="model-step" hidden>
      <label for="model">选择默认生图模型</label>
      <select id="model" aria-describedby="model-help"></select>
      <small id="model-help">当前分组没有原默认模型。列表显示这个分组可用的模型。</small>
    </div>
    <button id="submit" type="submit">验证并保存</button>
  </form>
  <p id="status" role="status"></p>
  <p id="success" role="status" hidden></p>
</main>
<script nonce="__NONCE__">
  const form = document.getElementById("setup");
  const key = document.getElementById("key");
  const model = document.getElementById("model");
  const submit = document.getElementById("submit");
  const status = document.getElementById("status");
  const modelStep = document.getElementById("model-step");
  const keyStep = document.getElementById("key-step");
  const instructions = document.getElementById("instructions");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (submit.disabled) return;
    submit.disabled = true;
    const choosing = !modelStep.hidden;
    submit.textContent = choosing ? "正在保存…" : "正在验证…";
    status.textContent = "";
    try {
      const payload = choosing ? { action: "save", model: model.value } : { action: "verify", key: key.value };
      const response = await fetch(location.pathname, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const result = await response.json();
      if (!response.ok) {
        if (choosing) {
          modelStep.hidden = true;
          keyStep.hidden = false;
          instructions.hidden = false;
          key.required = true;
          key.focus();
        }
        status.textContent = result.error;
        return;
      }
      key.value = "";
      instructions.hidden = true;
      if (result.models) {
        key.required = false;
        keyStep.hidden = true;
        model.replaceChildren(...result.models.map((id) => new Option(id, id)));
        modelStep.hidden = false;
        model.focus();
        return;
      }
      form.hidden = true;
      document.getElementById("title").textContent = "生图已就绪";
      const success = document.getElementById("success");
      success.hidden = false;
      success.textContent = "默认模型：" + result.model + "。回到聊天就可以继续生图，无需重启。";
    } catch {
      status.textContent = "无法连接本机设置页面。请回到聊天重新打开。";
    } finally {
      submit.disabled = false;
      submit.textContent = modelStep.hidden ? "验证并保存" : "保存设置";
    }
  });
</script>
</html>
